# GitHub Pages demosu: `web/` klasörünü olduğu gibi yayınlar. Sunucu yokken arayüz tarayıcı içi çevrimdışı motora (LocalFallbackEngine) düşer
# ve DEMO verisiyle çalışır; gerçek bir depoya dokunmaz.
#
# TETİKLEYİCİLER: `main`'de `web/` (ya da bu dosya) değişince kendiliğinden + elle (`gh workflow run pages.yml`).
# Ön koşul: Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions". Pages kapalıysa `configure-pages` adımı başarısız olur ve
# o commit için kırmızı bir koşu üretir (GitArc'ın `main CI` rozeti aynı commit'in TÜM koşularına bakar).
name: Pages demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
